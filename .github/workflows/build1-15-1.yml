name: Build QuickFIX Windows

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Cache vcpkg installed directory
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: vcpkg-${{ runner.os }}-x64-windows-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-
            vcpkg-${{ runner.os }}-

      # Install library dependencies via vcpkg
      - name: Install Dependencies via vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install libmysql:x64-windows libxml2:x64-windows libpq:x64-windows
          cd ..  

      - name: Add vcpkg binaries to PATH
        run: |
          echo "${{ github.workspace }}\vcpkg\installed\x64-windows\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # # Unzip the QuickFIX source archive
      # - name: Unpack QuickFIX sources
      #   run: tar -xf quickfix-1.15.1.zip
      - name: Download QuickFIX sources
        run: |
         curl -L -o quickfix-1.15.1.zip https://github.com/quickfix/quickfix/archive/refs/tags/v1.15.1.zip
         tar -xf quickfix-1.15.1.zip

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: pip install setuptools wheel

      # Configure and build with CMake and Ninja using vcpkg toolchain
      - name: Build with CMake/Ninja
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="../vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_CXX_FLAGS="/EHsc /MD" `
            -DCMAKE_EXE_LINKER_FLAGS="quickfix.lib ws2_32.lib" `
            -Dquickfix_INCLUDE_DIR="../quickfix-1.15.1" `
            -Dquickfix_LIB_DIR="../quickfix-1.15.1/lib" `
            -DHAVE_SSL=ON `
            -DLIBXML2_INCLUDE_DIR="../vcpkg/installed/x64-windows/include" `
            -DLIBXML2_LIBRARIES="../vcpkg/installed/x64-windows/lib/libxml2.lib" `
            -DPOSTGRESQL_INCLUDE_DIR="../vcpkg/installed/x64-windows/include" `
            -DPOSTGRESQL_LIBRARY="../vcpkg/installed/x64-windows/lib/libpq.lib" `
            -DHAVE_POSTGRESQL=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_UNIT_TESTS=OFF `
            ../quickfix-1.15.1
          cmake --build . --config Release --parallel 2

      - name: Build Wheel
        run: python setup.py bdist_wheel

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-wheel
          path: dist/*.whl
