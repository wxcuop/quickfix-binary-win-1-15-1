name: Build QuickFIX Windows

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2

      # Install dependencies using Chocolatey
      - name: Install Dependencies
        run: |
          choco install -y ninja
          choco install -y libxml2
          choco install -y mysql
          choco install -y postgresql

      # Install ODBC Driver for SQL Server (msodbcsql) via official MSI (correct link as of late 2024)
      - name: Install ODBC Driver for SQL Server
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2335671" -OutFile msodbcsql18.msi
          msiexec /i msodbcsql18.msi /quiet /qn /norestart IACCEPTMSODBCSQLLICENSETERMS=YES

      - name: Add libxml2 and PostgreSQL to PATH
        run: |
          echo "C:\Program Files\libxml2\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
          echo "C:\Program Files\PostgreSQL\18\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # Unzip the QuickFIX source archive, assuming the zip is in the repo
      - name: Unpack QuickFIX sources
        run: tar -xf quickfix-1.15.1.zip

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: pip install setuptools wheel

      # Configure and build with CMake and Ninja, pointing to the unzipped source dir
      - name: Build with CMake/Ninja
        run: |
          mkdir build
          cd build
          cmake -G Ninja ^
            -DCMAKE_CXX_FLAGS="/EHsc /MD" ^
            -DCMAKE_EXE_LINKER_FLAGS="quickfix.lib ws2_32.lib" ^
            -Dquickfix_INCLUDE_DIR="../quickfix-1.15.1" ^
            -Dquickfix_LIB_DIR="../quickfix-1.15.1/lib" ^
            -DHAVE_SSL=ON ^
            -DLIBXML2_INCLUDE_DIR="C:/Program Files/libxml2/include" ^
            -DLIBXML2_LIBRARIES="C:/Program Files/libxml2/lib" ^
            -DHAVE_ODBC=ON ^
            -DHAVE_MYSQL=ON ^
            -DHAVE_POSTGRESQL=ON ^
            ../quickfix-1.15.1
          ninja

      - name: Build Wheel
        run: python setup.py bdist_wheel

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-wheel
          path: dist/*.whl
